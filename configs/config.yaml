server:
  host: 0.0.0.0
  port: 8080
  mode: release

proxy:
  port_range:
    min: 20000
    max: 30000
  default_ttl: 30m
  max_instances: 100
  default_protocol: socks5

subscription:
  sources:
    - name: "主订阅"
      url: "https://sakuracat1203.xn--3iq226gfdb94q.com/api/v1/client/subscribe?token=4f35fd21737d4aeef8c6a88068aa301a"
      enabled: true
    - name: "备用订阅"
      url: "https://example2.com/api/v1/client/subscribe?token=yyy"
      enabled: false
  update_interval: 6h
  timeout: 30s

health_check:
  enabled: true
  interval: 5m
  timeout: 10s
  url: "https://tkglobal.melon.com/main/index.htm?langCd=EN"
  max_delay: 1000

log:
  level: info
  file: "./logs/proxypool.log"
